<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平台管理 · 清关管理系统</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/vendor/element-plus.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="app" v-cloak>
<div class="page" v-loading="loading">
  <div class="page-head">
    <h2 style="margin:0">平台管理</h2>
    <div class="spacer"></div>
    <el-radio-group v-model="view" @change="onView">
      <el-radio-button value="tenants">租户审核</el-radio-button>
      <el-radio-button value="audits">审计日志</el-radio-button>
      <el-radio-button value="bills">账单</el-radio-button>
      <el-radio-button value="accounts">账号</el-radio-button>
    </el-radio-group>
    <el-radio-group v-if="view === 'tenants'" v-model="status" @change="function () { q.page = 1; load(); }">
      <el-radio-button value="pending">待审核</el-radio-button>
      <el-radio-button value="active">已开通</el-radio-button>
      <el-radio-button value="rejected">已驳回</el-radio-button>
      <el-radio-button value="suspended">已停用</el-radio-button>
      <el-radio-button value="">全部</el-radio-button>
    </el-radio-group>
    <el-button @click="openPwd">修改密码</el-button>
    <el-button @click="logout">退出</el-button>
  </div>
  <div class="card" v-if="view === 'tenants'">
    <el-table :data="rows">
      <el-table-column prop="id" label="ID" width="70"></el-table-column>
      <el-table-column prop="code" label="租户代码" width="120"></el-table-column>
      <el-table-column prop="name" label="企业名称" min-width="170"></el-table-column>
      <el-table-column prop="plan_name" label="套餐" width="140"></el-table-column>
      <el-table-column label="隔离档" width="150">
        <template #default="s">{{ s.row.mode === 'dedicated' ? ('独享 ' + (s.row.db_name || ('qingguan_t_' + s.row.code))) : '共享库' }}</template>
      </el-table-column>
      <el-table-column label="有效期" width="210">
        <template #default="s"><el-tag :type="expiryState(s.row).type">{{ expiryState(s.row).label }}</el-tag></template>
      </el-table-column>
      <el-table-column label="联系人" min-width="150">
        <template #default="s">{{ s.row.contact_name }} {{ s.row.contact_phone || s.row.contact_email }}</template>
      </el-table-column>
      <el-table-column prop="admin_username" label="管理员" width="100"></el-table-column>
      <el-table-column prop="applied_at" label="申请时间" width="160"></el-table-column>
      <el-table-column label="状态" width="90">
        <template #default="s"><el-tag :type="tagType(s.row.status)">{{ statusText(s.row.status) }}</el-tag></template>
      </el-table-column>
      <el-table-column label="操作" width="300" fixed="right">
        <template #default="s">
          <template v-if="s.row.status === 'pending'">
            <el-button size="small" type="primary" @click="approve(s.row)">通过</el-button>
            <el-button size="small" type="danger" plain @click="reject(s.row)">驳回</el-button>
          </template>
          <el-button v-if="s.row.status === 'active'" size="small" type="warning" plain @click="suspend(s.row)">停用</el-button>
          <el-button v-if="s.row.status === 'active'" size="small" plain @click="resetPwd(s.row)">重置密码</el-button>
          <el-button v-if="s.row.status === 'suspended'" size="small" type="success" plain @click="enable(s.row)">启用</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination style="margin-top:12px;justify-content:flex-end" layout="total, prev, pager, next"
      :total="total" :page-size="q.pageSize" :current-page="q.page"
      @current-change="function (p) { q.page = p; load(); }"></el-pagination>
  </div>
  <div class="card" v-else-if="view === 'audits'" v-loading="aLoading">
    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">
      <el-select v-model="aAction" placeholder="全部动作" clearable style="width:150px"
        @change="function () { aq.page = 1; loadAudits(); }">
        <el-option v-for="a in auditActions" :key="a" :value="a" :label="auditText(a)"></el-option>
      </el-select>
      <el-input v-model="aTenant" placeholder="按租户代码过滤" clearable style="width:180px"
        @keyup.enter="function () { aq.page = 1; loadAudits(); }"
        @clear="function () { aq.page = 1; loadAudits(); }"></el-input>
      <el-button type="primary" plain @click="function () { aq.page = 1; loadAudits(); }">查询</el-button>
    </div>
    <el-table :data="aRows" :row-class-name="auditRowClass">
      <el-table-column prop="created_at" label="时间" width="160"></el-table-column>
      <el-table-column label="动作" width="120">
        <template #default="s"><el-tag :type="auditTag(s.row.action)">{{ auditText(s.row.action) }}</el-tag></template>
      </el-table-column>
      <el-table-column label="租户" min-width="170">
        <template #default="s">{{ s.row.tenant_code ? (s.row.tenant_code + ' · ' + s.row.tenant_name) : '—' }}</template>
      </el-table-column>
      <el-table-column label="操作人" width="110">
        <template #default="s">{{ s.row.operator || '申请人' }}</template>
      </el-table-column>
      <el-table-column prop="detail" label="详情" min-width="260" show-overflow-tooltip></el-table-column>
      <el-table-column prop="ip" label="IP" width="130"></el-table-column>
    </el-table>
    <el-pagination style="margin-top:12px;justify-content:flex-end" layout="total, prev, pager, next"
      :total="aTotal" :page-size="aq.pageSize" :current-page="aq.page"
      @current-change="function (p) { aq.page = p; loadAudits(); }"></el-pagination>
  </div>
  <div class="card" v-else-if="view === 'bills'" v-loading="bLoading">
    <div style="margin-bottom:12px">
      <div style="margin-bottom:6px;color:#909399">收款信息（租户「账单中心」展示，保存后即时生效；留空保存表示清空该项，租户端回落到系统默认提示）</div>
      <el-input type="textarea" v-model="noticeDraft" :rows="3" placeholder="对公账户、开户行、账号、汇款备注要求"></el-input>
      <el-button size="small" type="primary" style="margin-top:6px" :loading="noticeSaving" :disabled="!noticeLoaded" @click="saveNotice">保存收款信息</el-button>
    </div>
    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">
      <el-select v-model="bStatus" placeholder="全部状态" clearable style="width:140px"
        @change="function () { bq.page = 1; loadBills(); }">
        <el-option value="unpaid" label="待支付"></el-option>
        <el-option value="paid" label="已支付"></el-option>
        <el-option value="void" label="已作废"></el-option>
      </el-select>
      <el-input v-model="bTenant" placeholder="按租户代码过滤" clearable style="width:180px"
        @keyup.enter="function () { bq.page = 1; loadBills(); }"
        @clear="function () { bq.page = 1; loadBills(); }"></el-input>
      <el-button type="primary" plain @click="function () { bq.page = 1; loadBills(); }">查询</el-button>
    </div>
    <el-table :data="bRows">
      <el-table-column prop="id" label="账单号" width="90"></el-table-column>
      <el-table-column label="租户" min-width="170">
        <template #default="s">{{ s.row.tenant_code ? (s.row.tenant_code + ' · ' + s.row.tenant_name) : '—' }}</template>
      </el-table-column>
      <el-table-column label="周期" width="80">
        <template #default="s">{{ s.row.cycle === 'month' ? '月付' : '年付' }}</template>
      </el-table-column>
      <el-table-column label="金额" width="100">
        <template #default="s">¥{{ s.row.amount }}</template>
      </el-table-column>
      <el-table-column label="状态" width="90">
        <template #default="s">
          <el-tag :type="{ unpaid: 'warning', paid: 'success', void: 'info' }[s.row.status] || 'info'">
            {{ { unpaid: '待支付', paid: '已支付', void: '已作废' }[s.row.status] || s.row.status }}
          </el-tag>
        </template>
      </el-table-column>
      <el-table-column prop="created_at" label="生成时间" width="160"></el-table-column>
      <el-table-column prop="paid_at" label="支付时间" width="160">
        <template #default="s">{{ s.row.paid_at || '—' }}</template>
      </el-table-column>
      <el-table-column label="操作" width="170" fixed="right">
        <template #default="s">
          <template v-if="s.row.status === 'unpaid'">
            <el-button size="small" type="primary" @click="confirmBill(s.row)">确认收款</el-button>
            <el-button size="small" type="danger" plain @click="voidBill(s.row)">作废</el-button>
          </template>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination style="margin-top:12px;justify-content:flex-end" layout="total, prev, pager, next"
      :total="bTotal" :page-size="bq.pageSize" :current-page="bq.page"
      @current-change="function (p) { bq.page = p; loadBills(); }"></el-pagination>
  </div>
  <div class="card" v-else-if="view === 'accounts'" v-loading="accLoading">
    <div style="margin-bottom:12px">
      <el-button type="primary" @click="openAccount">新增账号</el-button>
    </div>
    <el-table :data="accRows">
      <el-table-column prop="id" label="ID" width="70"></el-table-column>
      <el-table-column prop="username" label="账号" width="180">
        <template #default="s">
          {{ s.row.username }}
          <el-tag v-if="s.row.id === meId" size="small" type="warning" style="margin-left:6px">当前账号</el-tag>
        </template>
      </el-table-column>
      <el-table-column prop="real_name" label="姓名" width="120"></el-table-column>
      <el-table-column prop="email" label="邮箱" min-width="160"></el-table-column>
      <el-table-column label="状态" width="90">
        <template #default="s">
          <el-tag :type="s.row.status === 1 ? 'success' : 'info'">{{ s.row.status === 1 ? '启用' : '停用' }}</el-tag>
        </template>
      </el-table-column>
      <el-table-column prop="last_login_at" label="最近登录" width="160">
        <template #default="s">{{ s.row.last_login_at || '—' }}</template>
      </el-table-column>
      <el-table-column prop="created_at" label="创建时间" width="160"></el-table-column>
      <el-table-column label="操作" width="230" fixed="right">
        <template #default="s">
          <template v-if="s.row.status === 1">
            <el-button v-if="s.row.id !== meId" size="small" type="warning" plain @click="accountDisable(s.row)">停用</el-button>
          </template>
          <template v-else>
            <el-button size="small" type="success" plain @click="accountEnable(s.row)">启用</el-button>
          </template>
          <el-button size="small" type="primary" plain @click="accountReset(s.row)">重置密码</el-button>
        </template>
      </el-table-column>
    </el-table>
  </div>
  <el-dialog v-model="accVisible" title="新增平台账号" width="420px">
    <el-form label-width="90px">
      <el-form-item label="账号" required><el-input v-model="accForm.username" placeholder="3-30 位字母、数字或下划线"></el-input></el-form-item>
      <el-form-item label="姓名" required><el-input v-model="accForm.real_name"></el-input></el-form-item>
      <el-form-item label="邮箱"><el-input v-model="accForm.email"></el-input></el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="accVisible = false">取消</el-button>
      <el-button type="primary" :loading="accSaving" @click="createAccount">创建</el-button>
    </template>
  </el-dialog>
  <el-dialog v-model="pwdVisible" :title="pwdForce ? '首次登录请修改密码' : '修改密码'" width="420px"
    :close-on-click-modal="!pwdForce" :close-on-press-escape="!pwdForce" :show-close="!pwdForce">
    <el-form label-width="90px">
      <el-form-item label="原密码"><el-input v-model="pwdForm.old_password" type="password" show-password></el-input></el-form-item>
      <el-form-item label="新密码"><el-input v-model="pwdForm.new_password" type="password" show-password placeholder="至少 10 位"></el-input></el-form-item>
      <el-form-item label="确认新密码"><el-input v-model="pwdForm.confirm" type="password" show-password></el-input></el-form-item>
    </el-form>
    <template #footer>
      <el-button v-if="pwdForce" @click="forceLogout">退出登录</el-button>
      <el-button v-if="!pwdForce" @click="pwdVisible = false">取消</el-button>
      <el-button type="primary" :loading="saving" @click="savePwd">确定</el-button>
    </template>
  </el-dialog>
</div>
</div>
<style>
  .el-table .audit-fail-row td.el-table__cell { background: #fef0f0; }
  .qg-copy-btn { padding: 5px 12px; border: 1px solid #409eff; background: #ecf5ff; color: #409eff;
    border-radius: 4px; cursor: pointer; font-size: 13px; }
  .qg-copy-btn:hover { background: #409eff; color: #fff; }
</style>
<script>window.QG_LOGIN_URL = '/admin-login.html';</script>
<script>
/* 一次性临时密码的复制按钮（HTML 字符串插入 MessageBox，故用全局函数 + 内联 onclick） */
function qgCopyTemp() {
  var el = document.getElementById('qg-temp-pwd');
  var t = el ? (el.textContent || '') : '';
  if (!t) { ElementPlus.ElMessage.warning('没有可复制的内容'); return; }
  var done = function () { ElementPlus.ElMessage.success('已复制，请通过线下渠道告知客户'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(function () { qgCopyTempFallback(t, done); });
  } else {
    qgCopyTempFallback(t, done);
  }
}
function qgCopyTempFallback(t, done) {
  var ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { ElementPlus.ElMessage.warning('复制失败，请手动抄写'); }
  document.body.removeChild(ta);
}
</script>
<script src="/assets/vendor/vue.global.prod.js"></script>
<script src="/assets/vendor/element-plus.full.min.js"></script>
<script src="/assets/vendor/icons.iife.min.js"></script>
<script src="/assets/js/common.js"></script>
<script>
QG.mount(function () {
  return {
    data: function () {
      return {
        rows: [], total: 0, loading: false, status: 'pending', q: { page: 1, pageSize: 20 },
        view: 'tenants',
        aRows: [], aTotal: 0, aLoading: false, aAction: '', aTenant: '', aq: { page: 1, pageSize: 20 },
        bRows: [], bTotal: 0, bLoading: false, bStatus: '', bTenant: '', bq: { page: 1, pageSize: 20 },
        accRows: [], accLoading: false, accVisible: false, accSaving: false,
        accForm: { username: '', real_name: '', email: '' },
        meId: 0,
        noticeDraft: '', noticeSaving: false, noticeLoaded: false,
        pwdVisible: false, pwdForce: false, saving: false,
        pwdForm: { old_password: '', new_password: '', confirm: '' },
        auditActions: ['register', 'approve', 'reject', 'suspend', 'enable', 'login', 'bill_paid', 'bill_void', 'provision_failed']
      };
    },
    created: function () {
      var self = this;
      /* 先探明会话：单 cookie 双 scope，租户令牌调平台接口一律 403（两边令牌互不通用），
         与其每个操作都弹错，不如直接送去平台登录页。未登录的 401 由 common.js 自动跳 admin-login。 */
      QG.get('/platform/me').then(function (u) {
        self.meId = (u && u.id) || 0;
        if (u && u.must_change_password) {
          self.pwdForce = true;
          self.pwdForm = { old_password: '', new_password: '', confirm: '' };
          self.pwdVisible = true;
        }
        self.load();
      }).catch(function (e) {
        if (e && e.code === 403) { location.href = '/admin-login.html'; return; }
        QG.err(e);
      });
    },
    methods: {
      load: function () {
        var self = this;
        self.loading = true;
        QG.get('/platform/tenants', { status: self.status, page: self.q.page, pageSize: self.q.pageSize })
          .then(function (d) { self.rows = d.list || []; self.total = d.total || 0; })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.loading = false; });
      },
      onView: function () {
        if (this.view === 'audits') { this.loadAudits(); }
        if (this.view === 'bills') { this.loadBills(); this.loadNotice(); }
        if (this.view === 'accounts') { this.loadAccounts(); }
      },
      openPwd: function () {
        this.pwdForm = { old_password: '', new_password: '', confirm: '' };
        this.pwdForce = false;
        this.pwdVisible = true;
      },
      savePwd: function () {
        var f = this.pwdForm;
        if (!f.old_password || !f.new_password) { return QG.warn('请填写完整'); }
        if (f.new_password.length < 10) { return QG.warn('新密码至少 10 位'); }
        if (f.new_password !== f.confirm) { return QG.warn('两次输入的新密码不一致'); }
        var self = this;
        self.saving = true;
        QG.post('/platform/password', { old_password: f.old_password, new_password: f.new_password })
          .then(function () { QG.toast('密码已修改，请重新登录'); setTimeout(function () { location.href = '/admin-login.html'; }, 800); })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.saving = false; });
      },
      /* 收款信息：提交空串 = 清空该项，租户端回落到系统默认提示（后端 SettingRepo::delete 语义） */
      loadNotice: function () {
        var self = this;
        self.noticeLoaded = false;
        QG.get('/platform/settings').then(function (d) {
          self.noticeDraft = (d && d.billing_notice) || '';
          self.noticeLoaded = true;
        }).catch(function (e) { QG.err(e); });
      },
      saveNotice: function () {
        var self = this;
        if (!self.noticeLoaded) { return QG.warn('收款信息尚未加载成功，请刷新后重试'); }
        var v = (self.noticeDraft || '').trim();
        self.noticeSaving = true;
        QG.put('/platform/settings', { billing_notice: v })
          .then(function () {
            QG.toast(v ? '收款信息已更新，租户账单中心即时生效' : '收款信息已清空，租户账单中心回落到系统默认提示');
          })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.noticeSaving = false; });
      },
      loadAccounts: function () {
        var self = this;
        self.accLoading = true;
        QG.get('/platform/accounts').then(function (d) { self.accRows = d || []; })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.accLoading = false; });
      },
      openAccount: function () {
        this.accForm = { username: '', real_name: '', email: '' };
        this.accVisible = true;
      },
      createAccount: function () {
        var self = this;
        var f = self.accForm;
        if (!f.username || !f.real_name) { return QG.warn('请填写账号和姓名'); }
        self.accSaving = true;
        QG.post('/platform/accounts', f)
          .then(function (d) {
            self.accVisible = false;
            self.showTempPassword(d.temp_password, f.username);
            self.loadAccounts();
          })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.accSaving = false; });
      },
      accountDisable: function (row) {
        var self = this;
        QG.confirm('确定停用「' + row.username + '」？其将无法登录平台。').then(function () {
          QG.post('/platform/accounts/' + row.id + '/disable', {})
            .then(function () { QG.toast('已停用'); self.loadAccounts(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      accountEnable: function (row) {
        var self = this;
        QG.post('/platform/accounts/' + row.id + '/enable', {})
          .then(function () { QG.toast('已启用'); self.loadAccounts(); })
          .catch(function (e) { QG.err(e); });
      },
      accountReset: function (row) {
        var self = this;
        QG.confirm('将为「' + row.username + '」生成新的临时密码，旧密码立即失效，其首登须修改。继续？').then(function () {
          QG.post('/platform/accounts/' + row.id + '/reset-password', {})
            .then(function (d) { self.showTempPassword(d.temp_password, row.username); self.loadAccounts(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      showTempPassword: function (temp, username) {
        ElementPlus.ElMessageBox.alert(
          '<div id="qg-temp-pwd" style="font-size:20px;font-family:monospace;letter-spacing:2px;text-align:center">' + temp + '</div>'
          + '<div style="color:#909399;font-size:12px;text-align:center">仅此一次展示，请复制后通过线下渠道告知「' + username + '」</div>'
          + '<div style="text-align:center;margin-top:10px"><button type="button" class="qg-copy-btn" onclick="qgCopyTemp()">复制临时密码</button></div>',
          '临时密码',
          { dangerouslyUseHTMLString: true, confirmButtonText: '我已线下交付' });
      },
      /* 强改态的逃生口：拿不到正确原密码时至少能退出登录（服务端标记仍在，下次登录照旧强改） */
      forceLogout: function () {
        QG.post('/platform/logout').then(function () { location.href = '/admin-login.html'; })
          .catch(function () { location.href = '/admin-login.html'; });
      },
      loadAudits: function () {
        var self = this;
        self.aLoading = true;
        QG.get('/platform/audits', {
          action: self.aAction, tenant: (self.aTenant || '').trim(),
          page: self.aq.page, pageSize: self.aq.pageSize
        }).then(function (d) { self.aRows = d.list || []; self.aTotal = d.total || 0; })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.aLoading = false; });
      },
      loadBills: function () {
        var self = this;
        self.bLoading = true;
        QG.get('/platform/bills', {
          status: self.bStatus, tenant: (self.bTenant || '').trim(),
          page: self.bq.page, pageSize: self.bq.pageSize
        }).then(function (d) { self.bRows = d.list || []; self.bTotal = d.total || 0; })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.bLoading = false; });
      },
      confirmBill: function (row) {
        var self = this;
        QG.confirm('确认已收到「' + row.tenant_code + '」' + (row.cycle === 'month' ? '月付' : '年付') + ' ¥' + row.amount + '？确认后服务期立即顺延。').then(function () {
          QG.post('/platform/bills/' + row.id + '/confirm', {})
            .then(function () { QG.toast('已确认收款'); self.loadBills(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      voidBill: function (row) {
        var self = this;
        ElementPlus.ElMessageBox.prompt('请输入作废原因', '作废账单 #' + row.id, {
          inputPattern: /\S+/, inputErrorMessage: '原因不能为空'
        }).then(function (r) {
          QG.post('/platform/bills/' + row.id + '/void', { reason: r.value })
            .then(function () { QG.toast('已作废'); self.loadBills(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      expiryState: function (row) {
        if (!row.expires_at) { return { label: '—', type: 'info' }; }
        var date = row.expires_at.slice(0, 10);
        var d = Math.ceil((new Date(row.expires_at.replace(' ', 'T')).getTime() - Date.now()) / 86400000);
        if (d > 30) { return { label: date, type: 'success' }; }
        if (d > 0) { return { label: date + '（剩 ' + d + ' 天）', type: 'warning' }; }
        var g = d + 30;
        return g > 0 ? { label: date + '（宽限剩 ' + g + ' 天）', type: 'danger' } : { label: date + '（已过期）', type: 'danger' };
      },
      auditText: function (a) {
        return { register: '注册申请', approve: '通过开通', reject: '驳回', suspend: '停用', enable: '启用', login: '平台登录', bill_paid: '确认收款', bill_void: '账单作废', provision_failed: '开通失败' }[a] || a;
      },
      auditTag: function (a) {
        return { approve: 'success', enable: 'success', reject: 'danger', bill_paid: 'success', bill_void: 'warning', provision_failed: 'danger', suspend: 'warning', register: 'info', login: 'info' }[a] || 'info';
      },
      auditRowClass: function (o) {
        return o.row && o.row.action === 'provision_failed' ? 'audit-fail-row' : '';
      },
      statusText: function (s) {
        return { pending: '待审核', active: '已开通', rejected: '已驳回', suspended: '已停用' }[s] || s;
      },
      tagType: function (s) {
        return { pending: 'warning', active: 'success', rejected: 'danger', suspended: 'info' }[s] || 'info';
      },
      approve: function (row) {
        var self = this;
        var tip = row.mode === 'dedicated'
          ? '确定通过「' + row.name + '」？将创建独立数据库 ' + (row.db_name || 'qingguan_t_' + row.code) + '、专用账号并播种默认数据，创建管理员 ' + row.admin_username + '。未付款前为 30 天试用期，可随时在账单中心续费。'
          : '确定通过「' + row.name + '」？将立即播种默认数据并创建管理员 ' + row.admin_username + '。未付款前为 30 天试用期，可随时在账单中心续费。';
        QG.confirm(tip).then(function () {
          QG.post('/platform/tenants/' + row.id + '/approve', {})
            .then(function () { QG.toast('已开通'); self.load(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      reject: function (row) {
        var self = this;
        ElementPlus.ElMessageBox.prompt('请输入驳回原因（会展示给申请人）', '驳回 ' + row.name, {
          inputPattern: /\S+/, inputErrorMessage: '原因不能为空',
          inputValidator: function (v) { return (v || '').length > 200 ? '不能超过 200 字' : true; }
        }).then(function (r) {
          QG.post('/platform/tenants/' + row.id + '/reject', { reason: r.value })
            .then(function () { QG.toast('已驳回'); self.load(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      suspend: function (row) {
        var self = this;
        QG.confirm('确定停用「' + row.name + '」？其用户将无法登录。').then(function () {
          QG.post('/platform/tenants/' + row.id + '/suspend', {})
            .then(function () { QG.toast('已停用'); self.load(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      enable: function (row) {
        var self = this;
        QG.post('/platform/tenants/' + row.id + '/enable', {})
          .then(function () { QG.toast('已启用'); self.load(); })
          .catch(function (e) { QG.err(e); });
      },
      resetPwd: function (row) {
        var self = this;
        QG.confirm('将为「' + row.code + '」的管理员 ' + row.admin_username + ' 生成新的临时密码，旧密码立即失效，客户首登须修改。继续？').then(function () {
          QG.post('/platform/tenants/' + row.id + '/reset-admin-password', {})
            .then(function (d) { self.showTempPassword(d.temp_password, row.admin_username); self.load(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      logout: function () {
        QG.post('/platform/logout', {}).finally(function () { location.href = '/admin-login.html'; });
      }
    }
  };
});
</script>
</body>
</html>
