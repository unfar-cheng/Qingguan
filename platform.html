<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平台管理 · 清关管理系统</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/vendor/element-plus.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="app" v-cloak>
<div class="page" v-loading="loading">
  <div class="page-head">
    <h2 style="margin:0">平台管理</h2>
    <div class="spacer"></div>
    <el-radio-group v-model="view" @change="onView">
      <el-radio-button value="tenants">租户审核</el-radio-button>
      <el-radio-button value="audits">审计日志</el-radio-button>
    </el-radio-group>
    <el-radio-group v-if="view === 'tenants'" v-model="status" @change="function () { q.page = 1; load(); }">
      <el-radio-button value="pending">待审核</el-radio-button>
      <el-radio-button value="active">已开通</el-radio-button>
      <el-radio-button value="rejected">已驳回</el-radio-button>
      <el-radio-button value="suspended">已停用</el-radio-button>
      <el-radio-button value="">全部</el-radio-button>
    </el-radio-group>
    <el-button @click="logout">退出</el-button>
  </div>
  <div class="card" v-if="view === 'tenants'">
    <el-table :data="rows">
      <el-table-column prop="id" label="ID" width="70"></el-table-column>
      <el-table-column prop="code" label="租户代码" width="120"></el-table-column>
      <el-table-column prop="name" label="企业名称" min-width="170"></el-table-column>
      <el-table-column prop="plan_name" label="套餐" width="140"></el-table-column>
      <el-table-column label="隔离档" width="150">
        <template #default="s">{{ s.row.mode === 'dedicated' ? ('独享 ' + (s.row.db_name || ('qingguan_t_' + s.row.code))) : '共享库' }}</template>
      </el-table-column>
      <el-table-column label="联系人" min-width="150">
        <template #default="s">{{ s.row.contact_name }} {{ s.row.contact_phone || s.row.contact_email }}</template>
      </el-table-column>
      <el-table-column prop="admin_username" label="管理员" width="100"></el-table-column>
      <el-table-column prop="applied_at" label="申请时间" width="160"></el-table-column>
      <el-table-column label="状态" width="90">
        <template #default="s"><el-tag :type="tagType(s.row.status)">{{ statusText(s.row.status) }}</el-tag></template>
      </el-table-column>
      <el-table-column label="操作" width="210" fixed="right">
        <template #default="s">
          <template v-if="s.row.status === 'pending'">
            <el-button size="small" type="primary" @click="approve(s.row)">通过</el-button>
            <el-button size="small" type="danger" plain @click="reject(s.row)">驳回</el-button>
          </template>
          <el-button v-if="s.row.status === 'active'" size="small" type="warning" plain @click="suspend(s.row)">停用</el-button>
          <el-button v-if="s.row.status === 'suspended'" size="small" type="success" plain @click="enable(s.row)">启用</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination style="margin-top:12px;justify-content:flex-end" layout="total, prev, pager, next"
      :total="total" :page-size="q.pageSize" :current-page="q.page"
      @current-change="function (p) { q.page = p; load(); }"></el-pagination>
  </div>
  <div class="card" v-else v-loading="aLoading">
    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">
      <el-select v-model="aAction" placeholder="全部动作" clearable style="width:150px"
        @change="function () { aq.page = 1; loadAudits(); }">
        <el-option v-for="a in auditActions" :key="a" :value="a" :label="auditText(a)"></el-option>
      </el-select>
      <el-input v-model="aTenant" placeholder="按租户代码过滤" clearable style="width:180px"
        @keyup.enter="function () { aq.page = 1; loadAudits(); }"
        @clear="function () { aq.page = 1; loadAudits(); }"></el-input>
      <el-button type="primary" plain @click="function () { aq.page = 1; loadAudits(); }">查询</el-button>
    </div>
    <el-table :data="aRows" :row-class-name="auditRowClass">
      <el-table-column prop="created_at" label="时间" width="160"></el-table-column>
      <el-table-column label="动作" width="120">
        <template #default="s"><el-tag :type="auditTag(s.row.action)">{{ auditText(s.row.action) }}</el-tag></template>
      </el-table-column>
      <el-table-column label="租户" min-width="170">
        <template #default="s">{{ s.row.tenant_code ? (s.row.tenant_code + ' · ' + s.row.tenant_name) : '—' }}</template>
      </el-table-column>
      <el-table-column label="操作人" width="110">
        <template #default="s">{{ s.row.operator || '申请人' }}</template>
      </el-table-column>
      <el-table-column prop="detail" label="详情" min-width="260" show-overflow-tooltip></el-table-column>
      <el-table-column prop="ip" label="IP" width="130"></el-table-column>
    </el-table>
    <el-pagination style="margin-top:12px;justify-content:flex-end" layout="total, prev, pager, next"
      :total="aTotal" :page-size="aq.pageSize" :current-page="aq.page"
      @current-change="function (p) { aq.page = p; loadAudits(); }"></el-pagination>
  </div>
</div>
</div>
<style>
  .el-table .audit-fail-row td.el-table__cell { background: #fef0f0; }
</style>
<script>window.QG_LOGIN_URL = '/admin-login.html';</script>
<script src="/assets/vendor/vue.global.prod.js"></script>
<script src="/assets/vendor/element-plus.full.min.js"></script>
<script src="/assets/vendor/icons.iife.min.js"></script>
<script src="/assets/js/common.js"></script>
<script>
QG.mount(function () {
  return {
    data: function () {
      return {
        rows: [], total: 0, loading: false, status: 'pending', q: { page: 1, pageSize: 20 },
        view: 'tenants',
        aRows: [], aTotal: 0, aLoading: false, aAction: '', aTenant: '', aq: { page: 1, pageSize: 20 },
        auditActions: ['register', 'approve', 'reject', 'suspend', 'enable', 'login', 'provision_failed']
      };
    },
    created: function () {
      var self = this;
      /* 先探明会话：单 cookie 双 scope，租户令牌调平台接口一律 403（两边令牌互不通用），
         与其每个操作都弹错，不如直接送去平台登录页。未登录的 401 由 common.js 自动跳 admin-login。 */
      QG.get('/platform/me').then(function () { self.load(); }).catch(function (e) {
        if (e && e.code === 403) { location.href = '/admin-login.html'; return; }
        QG.err(e);
      });
    },
    methods: {
      load: function () {
        var self = this;
        self.loading = true;
        QG.get('/platform/tenants', { status: self.status, page: self.q.page, pageSize: self.q.pageSize })
          .then(function (d) { self.rows = d.list || []; self.total = d.total || 0; })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.loading = false; });
      },
      onView: function () {
        if (this.view === 'audits') { this.loadAudits(); }
      },
      loadAudits: function () {
        var self = this;
        self.aLoading = true;
        QG.get('/platform/audits', {
          action: self.aAction, tenant: (self.aTenant || '').trim(),
          page: self.aq.page, pageSize: self.aq.pageSize
        }).then(function (d) { self.aRows = d.list || []; self.aTotal = d.total || 0; })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.aLoading = false; });
      },
      auditText: function (a) {
        return { register: '注册申请', approve: '通过开通', reject: '驳回', suspend: '停用', enable: '启用', login: '平台登录', provision_failed: '开通失败' }[a] || a;
      },
      auditTag: function (a) {
        return { approve: 'success', enable: 'success', reject: 'danger', provision_failed: 'danger', suspend: 'warning', register: 'info', login: 'info' }[a] || 'info';
      },
      auditRowClass: function (o) {
        return o.row && o.row.action === 'provision_failed' ? 'audit-fail-row' : '';
      },
      statusText: function (s) {
        return { pending: '待审核', active: '已开通', rejected: '已驳回', suspended: '已停用' }[s] || s;
      },
      tagType: function (s) {
        return { pending: 'warning', active: 'success', rejected: 'danger', suspended: 'info' }[s] || 'info';
      },
      approve: function (row) {
        var self = this;
        var tip = row.mode === 'dedicated'
          ? '确定通过「' + row.name + '」？将创建独立数据库 ' + (row.db_name || 'qingguan_t_' + row.code) + '、专用账号并播种默认数据，创建管理员 ' + row.admin_username + '。'
          : '确定通过「' + row.name + '」？将立即播种默认数据并创建管理员 ' + row.admin_username + '。';
        QG.confirm(tip).then(function () {
          QG.post('/platform/tenants/' + row.id + '/approve', {})
            .then(function () { QG.toast('已开通'); self.load(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      reject: function (row) {
        var self = this;
        ElementPlus.ElMessageBox.prompt('请输入驳回原因（会展示给申请人）', '驳回 ' + row.name, {
          inputPattern: /\S+/, inputErrorMessage: '原因不能为空',
          inputValidator: function (v) { return (v || '').length > 200 ? '不能超过 200 字' : true; }
        }).then(function (r) {
          QG.post('/platform/tenants/' + row.id + '/reject', { reason: r.value })
            .then(function () { QG.toast('已驳回'); self.load(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      suspend: function (row) {
        var self = this;
        QG.confirm('确定停用「' + row.name + '」？其用户将无法登录。').then(function () {
          QG.post('/platform/tenants/' + row.id + '/suspend', {})
            .then(function () { QG.toast('已停用'); self.load(); })
            .catch(function (e) { QG.err(e); });
        }).catch(function () {});
      },
      enable: function (row) {
        var self = this;
        QG.post('/platform/tenants/' + row.id + '/enable', {})
          .then(function () { QG.toast('已启用'); self.load(); })
          .catch(function (e) { QG.err(e); });
      },
      logout: function () {
        QG.post('/platform/logout', {}).finally(function () { location.href = '/admin-login.html'; });
      }
    }
  };
});
</script>
</body>
</html>
