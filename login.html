<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 清关管理系统</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/vendor/element-plus.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="app">
  <div class="login-wrap">
    <div class="login-card">
      <img v-if="brand.logo" :src="brand.logo" class="login-logo-img" alt="">
      <div v-else class="login-logo">清</div>
      <h1>{{ brand.name || '清关管理系统' }}</h1>
      <div class="sub">中美海运整柜 · ISF申报 / 清关 / 提拆派 / 查验</div>
      <el-form @submit.prevent="submit" @keyup.enter="submit">
        <el-input v-model="form.tenant" placeholder="请输入租户代码" size="large" clearable @blur="onTenantBlur">
          <template #prefix><el-icon><OfficeBuilding /></el-icon></template>
        </el-input>
        <el-input v-model="form.username" placeholder="请输入账号" size="large" clearable>
          <template #prefix><el-icon><User /></el-icon></template>
        </el-input>
        <el-input v-model="form.password" type="password" placeholder="请输入密码" size="large" show-password>
          <template #prefix><el-icon><Lock /></el-icon></template>
        </el-input>
        <el-button type="primary" size="large" :loading="loading" @click="submit">登 录</el-button>
      </el-form>
      <div class="login-foot">© {{ year }} 清关管理系统</div>
    </div>
  </div>
</div>
<script src="/assets/vendor/vue.global.prod.js"></script>
<script src="/assets/vendor/element-plus.full.min.js"></script>
<script src="/assets/vendor/icons.iife.min.js"></script>
<script src="/assets/js/common.js"></script>
<script>
QG.mount(function () {
  return {
    data: function () {
      return { form: { tenant: '', username: '', password: '' }, brand: { name: '', logo: '' }, loading: false, year: new Date().getFullYear() };
    },
    created: function () {
      /* 裸 fetch 探测会话（不走 QG.request：它的 401 自动跳转会在登录页上自跳死循环）。
         已是租户会话 → 直接进外壳；平台会话不拦——用户可能就是要再登一个租户，登录会顶替 cookie。 */
      fetch('/api/auth/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.code === 0 && j.data && j.data.scope !== 'platform') { location.href = '/index.html'; }
      }).catch(function () {});
    },
    methods: {
      onTenantBlur: function () {
        var self = this;
        var code = (self.form.tenant || '').trim();
        if (!code) { self.brand = { name: '', logo: '' }; return; }
        QG.get('/tenant/branding', { code: code }).then(function (d) {
          /* 失焦竞态守卫：慢响应回来时输入框已换成别的代码，就丢弃这次结果 */
          if ((self.form.tenant || '').trim() !== code) { return; }
          self.brand = (d && d.found) ? { name: d.name, logo: d.logo_url } : { name: '', logo: '' };
        }).catch(function () {});
      },
      submit: function () {
        var self = this;
        if (!self.form.tenant || !self.form.username || !self.form.password) {
          return QG.warn('请输入租户代码、账号和密码');
        }
        self.loading = true;
        QG.post('/auth/login', self.form)
          .then(function () {
            QG.toast('登录成功');
            location.href = '/index.html';
          })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.loading = false; });
      }
    }
  };
});
</script>
</body>
</html>
