# 清关管理系统 —— HTTP(80) 虚拟主机（Ubuntu + Apache2 适配版，替代宝塔/Nginx 方案）
#
# 证书签发后，80 端口只负责跳转到 https；应用本体在 qingguan-le-ssl.conf（443）。
# 保留 /.well-known/acme-challenge/ 不跳转：certbot 签发/续期走 HTTP-01 验证。

<VirtualHost *:80>
    ServerName qingguan.sflswall.com.cn

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]
    </IfModule>

    DocumentRoot /opt/qingguan
    <Directory /opt/qingguan>
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/qingguan-error.log
    CustomLog ${APACHE_LOG_DIR}/qingguan-access.log combined
</VirtualHost>
