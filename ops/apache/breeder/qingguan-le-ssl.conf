# 清关管理系统 —— HTTPS(443) 虚拟主机（Ubuntu + Apache2 适配版）
#
# 与宝塔说明书的差异：Nginx 的 location 段全部换成 Apache 的 mod_rewrite + <FilesMatch>：
#   · /api/xxx 统一重写到 api/index.php（已存在的文件如 install.php 直接放行）
#   · db/ 与 *.sql/*.md/*.log/*.ini 直接拒绝（对应说明书 §8.2）
#   · uploads/ 只允许下载，禁止执行脚本
#   · html/js/css 不缓存、version.json no-store（对应说明书 §三-6）

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName qingguan.sflswall.com.cn

    SSLEngine on
    # 证书由 acme.sh 以 tls-alpn-01（443）签发并安装到此处；HTTP-01 走 80 会被腾讯云未备案拦截
    SSLCertificateFile /etc/ssl/qingguan/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/qingguan/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    LimitRequestBody 52428800

    DocumentRoot /opt/qingguan

    <Directory /opt/qingguan>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^/?api/(.*)$ /api/index.php [L,QSA]
        </IfModule>
    </Directory>

    # 敏感文件与目录：直接拒绝
    <Directory /opt/qingguan/db>
        Require all denied
    </Directory>
    # 测试脚手架与部署/运维配置不进 Web：tests/ 里是可直接调用的脚本（会建租户、造订单），
    # ops/ 里是各机器的 vhost 与 php-fpm 配置
    <Directory /opt/qingguan/tests>
        Require all denied
    </Directory>
    <Directory /opt/qingguan/ops>
        Require all denied
    </Directory>
    <Files "install.php">
        Require all denied
    </Files>
    <DirectoryMatch "/opt/qingguan/(docs|\.git)">
        Require all denied
    </DirectoryMatch>
    # 运行时产物（限流计数等）是真实存在的文件，会绕过 rewrite 被静态直出——整目录禁止 Web 访问
    <Directory /opt/qingguan/api/runtime>
        Require all denied
    </Directory>
    <FilesMatch "\.(sql|md|log|ini|conf|sh|env|bak)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.(?!well-known)">
        Require all denied
    </FilesMatch>

    # 上传目录只允许下载，禁止执行任何脚本
    <Directory /opt/qingguan/uploads>
        Require all granted
        <FilesMatch "\.(php|php5|phtml|phar|jsp|asp|aspx|sh|exe)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # 业务前端代码一律不缓存；版号文件必须实时
    <FilesMatch "\.(html?|js|css)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
    <Files "version.json">
        Header set Cache-Control "no-store"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/qingguan-error.log
    CustomLog ${APACHE_LOG_DIR}/qingguan-access.log combined
</VirtualHost>
</IfModule>
