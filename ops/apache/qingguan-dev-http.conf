# 清关管理系统 · 本机开发环境 —— HTTP(80) 虚拟主机
#
# 安装： sudo cp /data/qingguan/app/ops/apache/qingguan-dev-http.conf /etc/httpd/conf.d/
#        sudo systemctl reload httpd
#
# 80 端口只做两件事：放行 ACME 验证目录（certbot 签发/续期走 HTTP-01），其余 301 到 https。
# 应用本体在 qingguan-dev-ssl.conf（443）。

<VirtualHost *:80>
    ServerName qingguan-dev.sflswall.com.cn

    DocumentRoot /data/qingguan/app

    # ACME 验证目录必须能读、且不被下面的重写吃掉
    <Directory /data/qingguan/app/.well-known/acme-challenge>
        Require all granted
        Options None
        AllowOverride None
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]

    ErrorLog /var/log/httpd/qingguan-dev-error.log
    CustomLog /var/log/httpd/qingguan-dev-access.log combined
</VirtualHost>
