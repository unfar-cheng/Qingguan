# 清关管理系统 · 本机开发环境 —— HTTPS(443) 虚拟主机
#
# 安装（证书签发之后再装这个）：
#   sudo cp /data/qingguan/app/ops/apache/qingguan-dev-ssl.conf /etc/httpd/conf.d/
#   sudo systemctl reload httpd
#
# 与生产（breeder 的 /opt/qingguan）保持同一套 URL 规则：/api/xxx 重写到 api/index.php，
# 静态文件直读。差异只在于 PHP 的运行方式：生产是全局的 php8.3-fpm，本机是在 vhost 里
# 显式指到 127.0.0.1:9083（配置文件 ops/php83-fpm.conf，以 frappe 身份运行）。

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName qingguan-dev.sflswall.com.cn

    SSLEngine on
    Protocols h2 http/1.1
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /data/qingguan/var/letsencrypt/live/qingguan-dev.sflswall.com.cn/fullchain.pem
    SSLCertificateKeyFile /data/qingguan/var/letsencrypt/live/qingguan-dev.sflswall.com.cn/privkey.pem

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Robots-Tag "noindex, nofollow"
    LimitRequestBody 52428800

    DocumentRoot /data/qingguan/app
    DirectoryIndex index.php index.html

    <Directory /data/qingguan/app>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None

        # PHP 8.3（本机并行安装，不是系统的 7.4）
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://127.0.0.1:9083"
        </FilesMatch>

        # /api/xxx → api/index.php（真实存在的文件直接放行，如 assets 下的静态资源）
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^/?api/(.*)$ /api/index.php [L,QSA]
        </IfModule>
    </Directory>

    # 开发机上不需要安装器；一次性用过就删，避免留个未鉴权的建号入口
    <Files "install.php">
        Require all denied
    </Files>

    # 源码仓库里的这些内容不该被 Web 访问
    <Directory /data/qingguan/app/db>
        Require all denied
    </Directory>
    <Directory /data/qingguan/app/ops>
        Require all denied
    </Directory>
    <Directory /data/qingguan/app/tests>
        Require all denied
    </Directory>
    <DirectoryMatch "/data/qingguan/app/(docs|\.git)">
        Require all denied
    </DirectoryMatch>

    # 运行时产物（限流计数等）是真实存在的文件，会绕过 rewrite 被静态直出——整目录禁止 Web 访问
    <Directory /data/qingguan/app/api/runtime>
        Require all denied
    </Directory>
    <FilesMatch "\.(sql|md|log|ini|conf|sh|env|bak)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.(?!well-known)">
        Require all denied
    </FilesMatch>

    # 上传目录只允许下载，禁止执行任何脚本
    <Directory /data/qingguan/app/uploads>
        Require all granted
        <FilesMatch "\.(php|php5|phtml|phar|jsp|asp|aspx|sh|exe)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # 前端代码不缓存；版号文件必须实时
    <FilesMatch "\.(html?|js|css)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
    <Files "version.json">
        Header set Cache-Control "no-store"
    </Files>

    ErrorLog /var/log/httpd/qingguan-dev-error.log
    CustomLog /var/log/httpd/qingguan-dev-access.log combined
</VirtualHost>
</IfModule>
