; 本机开发环境专用：php83-fpm 池配置
;
; 为什么不走 remi 自带的 /etc/opt/remi/php83/php-fpm.conf：
;   自带那份的池里写了 user = apache，而本机上跑 php-fpm 的是普通用户 frappe
;   （sudo 只放行了 dnf/mysql/cp 与少数 systemctl），非 root 启动时无法 setuid。
;   所以这里单独写一份、省略 user/group，进程就以 frappe 身份跑 —— 正好和代码目录的
;   属主一致，uploads/ 与 api/runtime/ 不需要额外授权。
;
; 启动：
;   /opt/remi/php83/root/usr/sbin/php-fpm -y /data/qingguan/app/ops/php83-fpm.conf
; 重载（改配置后）：
;   kill -USR2 $(cat /data/qingguan/var/php83-fpm.pid)
; 停止：
;   kill $(cat /data/qingguan/var/php83-fpm.pid)

[global]
pid = /data/qingguan/var/php83-fpm.pid
error_log = /data/qingguan/var/php83-fpm.log
log_level = notice
daemonize = yes

[www]
listen = 127.0.0.1:9083
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /fpm-status

catch_workers_output = yes
decorate_workers_output = no

security.limit_extensions = .php

php_admin_value[error_log] = /data/qingguan/var/php83-fpm-www-error.log
php_admin_flag[log_errors] = on
php_admin_value[max_execution_time] = 300
php_value[upload_max_filesize] = 50M
php_value[post_max_size] = 52M
