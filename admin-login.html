<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平台管理登录 · 清关管理系统</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/vendor/element-plus.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="app" v-cloak>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">清</div>
      <h1>平台管理</h1>
      <div class="sub">清关管理系统 · 运营后台</div>
      <el-alert v-if="tip" :title="tip" type="warning" :closable="false" style="margin-bottom:12px" />
      <el-form @submit.prevent="submit" @keyup.enter="submit">
        <el-input v-model="form.username" placeholder="平台账号" size="large" clearable>
          <template #prefix><el-icon><User /></el-icon></template>
        </el-input>
        <el-input v-model="form.password" type="password" placeholder="密码" size="large" show-password>
          <template #prefix><el-icon><Lock /></el-icon></template>
        </el-input>
        <el-button type="primary" size="large" :loading="loading" @click="submit">登 录</el-button>
      </el-form>
      <div class="login-foot">© {{ year }} 清关管理系统</div>
    </div>
  </div>
</div>
<script src="/assets/vendor/vue.global.prod.js"></script>
<script src="/assets/vendor/element-plus.full.min.js"></script>
<script src="/assets/vendor/icons.iife.min.js"></script>
<script src="/assets/js/common.js"></script>
<script>
QG.mount(function () {
  return {
    data: function () {
      return { form: { username: '', password: '' }, tip: '', loading: false, year: new Date().getFullYear() };
    },
    created: function () {
      var self = this;
      /* 裸 fetch 探测会话（不走 QG.request：它的 401 自动跳转会在登录页上自跳死循环）。
         已是平台会话 → 直接进后台；是租户会话（403）→ 提示登录会顶替；未登录 → 正常显示表单。 */
      fetch('/api/platform/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.code === 0) { location.href = '/platform.html'; return; }
        if (j.code === 403) { self.tip = '当前浏览器登录的是租户账号，登录平台账号后将替换该会话'; }
      }).catch(function () {});
    },
    methods: {
      submit: function () {
        var self = this;
        if (!self.form.username || !self.form.password) {
          return QG.warn('请输入账号和密码');
        }
        self.loading = true;
        QG.post('/platform/login', self.form)
          .then(function () { location.href = '/platform.html'; })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.loading = false; });
      }
    }
  };
});
</script>
</body>
</html>
