<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账单中心</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/vendor/element-plus.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="app" v-cloak>
<div class="page" v-loading="loading">
  <div class="page-head">
    <h2 style="margin:0">账单中心</h2>
    <div class="spacer"></div>
    <el-button type="primary" @click="renewVisible = true">续费</el-button>
  </div>
  <div class="card">
    <div v-if="billing" style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
      <span style="color:#909399">服务期</span>
      <el-tag :type="svc.type">{{ svc.label }}</el-tag>
      <span style="font-size:13px">{{ svc.detail }}</span>
    </div>
    <el-alert v-if="notice" :title="notice" type="info" :closable="false" style="margin-bottom:12px"></el-alert>
    <el-table :data="rows">
      <el-table-column prop="id" label="账单号" width="90"></el-table-column>
      <el-table-column label="周期" width="90">
        <template #default="s">{{ s.row.cycle === 'month' ? '月付' : '年付' }}</template>
      </el-table-column>
      <el-table-column label="金额" width="110">
        <template #default="s">¥{{ s.row.amount }}</template>
      </el-table-column>
      <el-table-column label="状态" width="100">
        <template #default="s">
          <el-tag :type="{ unpaid: 'warning', paid: 'success', void: 'info' }[s.row.status] || 'info'">
            {{ { unpaid: '待支付', paid: '已支付', void: '已作废' }[s.row.status] || s.row.status }}
          </el-tag>
        </template>
      </el-table-column>
      <el-table-column prop="created_at" label="生成时间" width="160"></el-table-column>
      <el-table-column prop="paid_at" label="支付时间" width="160">
        <template #default="s">{{ s.row.paid_at || '—' }}</template>
      </el-table-column>
      <el-table-column prop="remark" label="备注" min-width="140"></el-table-column>
    </el-table>
  </div>
  <el-dialog v-model="renewVisible" title="续费" width="420px">
    <el-form label-width="90px">
      <el-form-item label="续费周期">
        <el-radio-group v-model="renewCycle">
          <el-radio-button value="year">年付</el-radio-button>
          <el-radio-button value="month">月付</el-radio-button>
        </el-radio-group>
      </el-form-item>
    </el-form>
    <div style="color:#909399;font-size:12px;line-height:1.8">{{ notice }}</div>
    <template #footer>
      <el-button @click="renewVisible = false">取消</el-button>
      <el-button type="primary" :loading="saving" @click="doRenew">生成账单</el-button>
    </template>
  </el-dialog>
</div>
</div>
<script src="/assets/vendor/vue.global.prod.js"></script>
<script src="/assets/vendor/element-plus.full.min.js"></script>
<script src="/assets/vendor/icons.iife.min.js"></script>
<script src="/assets/js/common.js"></script>
<script>
QG.mount(function () {
  return {
    data: function () {
      return { rows: [], loading: false, saving: false, renewVisible: false, renewCycle: 'year', notice: '', billing: null };
    },
    computed: {
      svc: function () {
        var b = this.billing;
        if (!b) { return { type: 'info', label: '—', detail: '' }; }
        var d = b.expires_at ? String(b.expires_at).slice(0, 10) : '';
        if (b.state === 'none') { return { type: 'info', label: '未设置', detail: '当前租户未设置有效期（长期有效）' }; }
        if (b.state === 'normal') { return { type: 'success', label: '服务期至 ' + d, detail: '剩余 ' + b.days_left + ' 天' }; }
        if (b.state === 'soon') { return { type: 'warning', label: '服务期至 ' + d, detail: '剩余 ' + b.days_left + ' 天，请及时续费' }; }
        if (b.state === 'grace') {
          return b.trial
            ? { type: 'danger', label: '试用中', detail: '剩余 ' + b.days_left + ' 天（至 ' + (b.grace_end || '') + '），付款后服务期自审核日起算' }
            : { type: 'danger', label: '已到期', detail: '服务期已于 ' + d + ' 到期，宽限至 ' + (b.grace_end || '') };
        }
        return { type: 'danger', label: '已过期', detail: '服务期已于 ' + d + ' 到期，请联系平台续费' };
      }
    },
    created: function () {
      var self = this;
      QG.get('/auth/me').then(function (u) {
        self.billing = (u && u.billing) || null;
        self.notice = (u && u.billing && u.billing.notice) || '请联系平台获取收款账户信息';
      }).catch(function () {});
      this.load();
    },
    methods: {
      load: function () {
        var self = this;
        self.loading = true;
        QG.get('/bills').then(function (d) { self.rows = d || []; })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.loading = false; });
      },
      doRenew: function () {
        var self = this;
        self.saving = true;
        QG.post('/bills', { cycle: self.renewCycle })
          .then(function () {
            QG.toast('账单已生成，转账后请联系平台确认');
            self.renewVisible = false;
            self.load();
          })
          .catch(function (e) { QG.err(e); })
          .finally(function () { self.saving = false; });
      }
    }
  };
});
</script>
</body>
</html>
